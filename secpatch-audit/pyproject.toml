[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secpatch-audit"
version = "0.1.0"
description = "Two-sided verification of security patches"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "GitPython>=3.1",
  "unidiff>=0.7",
  "polars>=1.0",
]

[project.optional-dependencies]
corpus = [
  "datasets>=2.20",
  "huggingface-hub>=0.24",
]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
secpatch = "secpatch_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/secpatch_audit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
